<style>
    nav{
    display: flex;
    justify-content: space-between;
        margin-top: 20px;
}
.logo{
    height: 50px;
    
}
.nav-links{
    display: flex;
    list-style-type: none;
    gap: 30px;
    font-family: inherit
    
    
}
a{
    text-decoration: none;
    color: var(--navigationLinkColor);
}

.home a{
text-decoration: underline;
}

.slideshow{
    width: 100%;
    height: 100vh;
    position: relative;
    overflow: hidden;
    margin-top: 10px;
}
.slide{
    width: 100%;
    height: 100%;
    object-fit: cover;
    position: absolute;
    opacity: 0;
    animation: slideshow 27s infinite;
}

.slide:nth-child(1){animation-delay: 0s;}
.slide:nth-child(2){animation-delay: 3s;}
.slide:nth-child(3){animation-delay: 6s;}
.slide:nth-child(4){animation-delay: 9s;}
.slide:nth-child(5){animation-delay: 12s;}
.slide:nth-child(6){animation-delay: 15s;}
.slide:nth-child(7){animation-delay: 18s;}

@keyframes slideshow{
    0%{
        opacity: 0;
    }
    5%{
        opacity: 1;
    }
    14%{
      opacity: 1;  
    }
    19%{
        opacity: 0;
    }
    100%{
        opacity: 0;
    }
}

.picture{
    display: flex;
    flex-direction: row;
    margin-top: 90px;
    align-items: flex-start;
    
}
.picture img{
    height: 550px;
    width: 550px;
    border-radius: 20px;
    margin-left: 260px;
}


    .text{
        display: flex;
        flex-direction: column;
        margin-left: 70px;
    }
    .text h2{
      font-size: 40px;
    }
    .text h4{
        font-size: 20px;
    }
    .text p{
       font-size: 20px;
       font-family: 'Courier New', Courier, monospace;
}
    
footer{
   display: flex; 
   align-items: center;
   gap: 15px;
   margin-top: 80px;
   margin-bottom: 30px;
   justify-content: center;
}
footer img{
    width: 45px;
    height: 45px;
    
}
    
    
</style>
